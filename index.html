<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up form</title>
</head>
<body>
    <div class="container">
        <div class="left">
            <h3>Gigi Murin Fanclub</h3>
        </div>
        <div class="right">
            <p>Gigi Murin is a virtual youtuber from hololive whose main quirk is being chaotic and fun!
                All kinds of people are welcome to this club, old fan or new one you have a place here, so what are
                you waiting for? Lets all be whimsical and have fun!!!
            </p>
            <div class="form-container">
                <form id="user-form" action="#">
                    <div>
                        <div class="form-control">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-control">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <div>
                        <div class="form-control">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" minlength="8" required>
                        </div>
                        <div class="form-control">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
                        </div>
                    </div>
                </form>
            </div>
            <button type="submit" form="user-form">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>
</body>
</html>
